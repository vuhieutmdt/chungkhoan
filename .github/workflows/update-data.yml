name: Cập nhật dữ liệu

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 16:30 giờ Việt Nam, thứ 2-6 (sau khi đóng cửa)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_data.py
      - name: Commit nếu có thay đổi
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add site/data
          git diff --staged --quiet || (git commit -m "Cập nhật dữ liệu $(date +%F)" && git push)
